plugins { id 'com.android.application' }
android {
    namespace 'com.airnovation.aivoicekeyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.airnovation.aivoicekeyboard'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.17-local-preview'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Stable signing is optional; configure GitHub Actions secrets before relying on
    // install-over updates. A newly generated signing identity cannot update
    // any already-installed APK signed with a different debug certificate.
    signingConfigs {
        if (System.getenv("AE_SIGNING_FILE")) {
            stableTest {
                storeFile file(System.getenv("AE_SIGNING_FILE"))
                storePassword System.getenv("AE_STORE_PASSWORD")
                keyAlias System.getenv("AE_KEY_ALIAS")
                keyPassword System.getenv("AE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        // Explicitly authorized one-off side-by-side test. Never use this identity
        // for the original application or promise long-term install-over updates.
        isolatedTest {
            initWith release
            applicationIdSuffix '.assistanttest'
            versionNameSuffix '-isolated-test'
            debuggable false
            signingConfig signingConfigs.debug
        }
        debug {
            if (System.getenv("AE_SIGNING_FILE")) {
                signingConfig signingConfigs.stableTest
            }
        }
    }
}
