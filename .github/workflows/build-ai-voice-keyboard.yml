name: Build AI Voice Keyboard (prototype)

on:
  push:
    branches:
      - prototype/ai-voice-keyboard
    paths:
      - 'ai-voice-keyboard/**'
      - '.github/workflows/build-ai-voice-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages using GitHub runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned-for-release, signed-for-debug APK
        run: gradle -p ai-voice-keyboard :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-voice-keyboard-debug-apk
          path: ai-voice-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish v0.6 test download
        # Keep the normal Actions artifact even if release publishing is unavailable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=ai-voice-keyboard-v0.6-test
          APK=ai-voice-keyboard/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" AI-Voice-Keyboard-v0.6-test.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Voice Keyboard v0.6 (TEST)" --notes "Experimental manual start/stop voice recording; review before using in WhatsApp. Test build; not production signed. Android may require uninstalling the prior debug build if its signing certificate differs. Back up your API key before uninstalling." --prerelease
          fi
          gh release upload "$TAG" AI-Voice-Keyboard-v0.6-test.apk --clobber
          echo "Direct test download: https://github.com/${GH_REPO}/releases/download/${TAG}/AI-Voice-Keyboard-v0.6-test.apk"
